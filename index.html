<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>dist - 小红书链接转换工具</title>
  <style>
    :root {
      --primary: #ff6b6b;
      --primary-light: #fff0f0;
      --primary-dark: #e85555;
      --text: #1a1a1a;
      --text-secondary: #666;
      --text-tertiary: #999;
      --bg: #fafafa;
      --card-bg: #fff;
      --border: #eee;
      --success: #52c41a;
      --error: #ff4d4f;
      --warning: #faad14;
      --radius: 16px;
      --radius-sm: 10px;
      --shadow: 0 2px 12px rgba(0,0,0,0.06);
      --shadow-hover: 0 4px 20px rgba(0,0,0,0.1);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
      background: var(--bg);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
    }

    .container {
      max-width: 560px;
      margin: 0 auto;
      padding: 40px 20px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Header */
    .header {
      text-align: center;
      margin-bottom: 32px;
    }

    .logo {
      font-size: 42px;
      font-weight: 800;
      letter-spacing: -1px;
      color: var(--text);
      line-height: 1;
    }

    .subtitle {
      font-size: 14px;
      color: var(--text-secondary);
      margin-top: 8px;
      font-weight: 400;
    }

    /* Input Section */
    .input-section {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 20px;
      box-shadow: var(--shadow);
      margin-bottom: 16px;
    }

    .input-wrapper {
      position: relative;
    }

    .input-label {
      font-size: 13px;
      color: var(--text-secondary);
      margin-bottom: 8px;
      display: block;
    }

    .input-area {
      width: 100%;
      min-height: 120px;
      padding: 14px 16px;
      border: 1.5px solid var(--border);
      border-radius: var(--radius-sm);
      font-size: 15px;
      line-height: 1.6;
      resize: vertical;
      transition: all 0.2s ease;
      font-family: inherit;
      color: var(--text);
      background: var(--bg);
    }

    .input-area::placeholder {
      color: var(--text-tertiary);
    }

    .input-area:focus {
      outline: none;
      border-color: var(--primary);
      background: var(--card-bg);
      box-shadow: 0 0 0 3px rgba(255, 107, 107, 0.1);
    }

    .paste-btn {
      position: absolute;
      top: 38px;
      right: 8px;
      padding: 6px 14px;
      background: var(--primary-light);
      color: var(--primary);
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .paste-btn:hover {
      background: var(--primary);
      color: white;
    }

    .paste-btn:active {
      transform: scale(0.96);
    }

    /* Convert Button */
    .convert-btn {
      width: 100%;
      padding: 14px;
      margin-top: 14px;
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
      color: white;
      border: none;
      border-radius: var(--radius-sm);
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      position: relative;
      overflow: hidden;
    }

    .convert-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(255, 107, 107, 0.35);
    }

    .convert-btn:active {
      transform: translateY(0);
    }

    .convert-btn:disabled {
      opacity: 0.7;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    .spinner {
      width: 18px;
      height: 18px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      display: none;
    }

    .convert-btn.loading .spinner {
      display: inline-block;
    }

    .convert-btn.loading .btn-text {
      opacity: 0.8;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Result Card */
    .result-section {
      display: none;
      margin-top: 16px;
    }

    .result-section.show {
      display: block;
      animation: fadeInUp 0.3s ease;
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .result-card {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 20px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
    }

    .result-label {
      font-size: 12px;
      color: var(--text-tertiary);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 10px;
    }

    .result-url {
      font-size: 14px;
      color: var(--text);
      word-break: break-all;
      white-space: pre-wrap;
      line-height: 1.6;
      padding: 12px;
      background: var(--bg);
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      font-family: 'SF Mono', Monaco, monospace;
    }

    .result-actions {
      display: flex;
      gap: 10px;
      margin-top: 14px;
    }

    .action-btn {
      flex: 1;
      padding: 12px;
      border-radius: var(--radius-sm);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      border: 1.5px solid transparent;
    }

    .action-btn.primary {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
    }

    .action-btn.primary:hover {
      background: var(--primary-dark);
      border-color: var(--primary-dark);
    }

    .action-btn.secondary {
      background: var(--card-bg);
      color: var(--text);
      border-color: var(--border);
    }

    .action-btn.secondary:hover {
      background: var(--bg);
      border-color: var(--text-tertiary);
    }

    .action-btn:active {
      transform: scale(0.98);
    }

    /* Alert / Message */
    .alert {
      padding: 14px 16px;
      border-radius: var(--radius-sm);
      font-size: 14px;
      line-height: 1.5;
      display: none;
      align-items: flex-start;
      gap: 10px;
      margin-top: 16px;
    }

    .alert.show {
      display: flex;
      animation: fadeInUp 0.3s ease;
    }

    .alert-error {
      background: #fff2f0;
      border: 1px solid #ffccc7;
      color: var(--error);
    }

    .alert-warning {
      background: #fffbe6;
      border: 1px solid #ffe58f;
      color: #d48806;
    }

    .alert-success {
      background: #f6ffed;
      border: 1px solid #b7eb8f;
      color: var(--success);
    }

    .alert-icon {
      flex-shrink: 0;
      width: 18px;
      height: 18px;
      margin-top: 1px;
    }

    /* Clear Button */
    .clear-btn {
      display: none;
      width: 100%;
      padding: 12px;
      margin-top: 12px;
      background: transparent;
      color: var(--text-tertiary);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .clear-btn.show {
      display: block;
    }

    .clear-btn:hover {
      color: var(--text-secondary);
      border-color: var(--text-tertiary);
    }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: rgba(0,0,0,0.8);
      color: white;
      padding: 12px 24px;
      border-radius: 100px;
      font-size: 14px;
      font-weight: 500;
      opacity: 0;
      transition: all 0.3s ease;
      pointer-events: none;
      z-index: 1000;
      white-space: nowrap;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* Footer */
    .footer {
      margin-top: auto;
      padding-top: 32px;
      text-align: center;
      font-size: 12px;
      color: var(--text-tertiary);
    }

    /* Responsive */
    @media (max-width: 480px) {
      .container {
        padding: 24px 16px;
      }

      .logo {
        font-size: 36px;
      }

      .input-section {
        padding: 16px;
      }

      .result-actions {
        flex-direction: column;
      }
    }

    /* Icon SVG inline */
    .icon {
      width: 16px;
      height: 16px;
      fill: currentColor;
    }
  </style>
</head>
<body>
  <div class="container">
    <header class="header">
      <h1 class="logo">dist</h1>
      <p class="subtitle">小红书链接转换工具</p>
    </header>

    <section class="input-section">
      <label class="input-label">粘贴小红书分享文案或链接</label>
      <div class="input-wrapper">
        <textarea
          id="input"
          class="input-area"
          placeholder="例如：&#10;我发现了一篇有意思的笔记，快一起来看看&#10;http://xhslink.com/a/1xyzABC"
        ></textarea>
        <button class="paste-btn" id="pasteBtn" onclick="pasteFromClipboard()">
          <svg class="icon" viewBox="0 0 24 24"><path d="M19 3h-4.18C14.4 1.84 13.3 1 12 1s-2.4.84-2.82 2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 0c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1zm7 16H5V5h2v3h10V5h2v14z"/></svg>
          粘贴
        </button>
      </div>
      <button class="convert-btn" id="convertBtn" onclick="convertLink()">
        <span class="spinner"></span>
        <span class="btn-text">批量转换链接</span>
      </button>
    </section>

    <div class="alert alert-error" id="errorAlert">
      <svg class="alert-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg>
      <span id="errorText"></span>
    </div>

    <div class="alert alert-warning" id="warningAlert">
      <svg class="alert-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M1 21h22L12 2 1 21zm12-3h-2v-2h2v2zm0-4h-2v-4h2v4z"/></svg>
      <span id="warningText"></span>
    </div>

    <div class="alert alert-success" id="successAlert">
      <svg class="alert-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>
      <span id="successText"></span>
    </div>

    <section class="result-section" id="resultSection">
      <div class="result-card">
        <div class="result-label">转换后的标准链接（每行一条）</div>
        <div class="result-url" id="resultUrl"></div>
        <div class="result-actions">
          <button class="action-btn primary" id="copyBtn" onclick="copyResult()">
            <svg class="icon" viewBox="0 0 24 24"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg>
            复制链接
          </button>
          <a class="action-btn secondary" id="openBtn" href="#" target="_self">
            <svg class="icon" viewBox="0 0 24 24"><path d="M19 19H5V5h7V3H5c-1.11 0-2 .9-2 2v14c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2v-7h-2v7zM14 3v2h3.59l-9.83 9.83 1.41 1.41L19 6.41V10h2V3h-7z"/></svg>
            打开链接
          </a>
        </div>
      </div>
      <button class="clear-btn show" id="clearBtn" onclick="clearAll()">清空重输</button>
    </section>

    <footer class="footer">
      不保存输入 · 无广告 · 无需登录
    </footer>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    // ========== 配置 ==========
    const ALLOWED_DOMAINS = ['xhslink.com', 'xiaohongshu.com', 'www.xiaohongshu.com'];
    const PROXY_URL = 'https://corsproxy.io/?url=';
    const TIMEOUT_MS = 8000;

    // ========== 正则表达式 ==========
    const LINK_REGEX = /(https?:\/\/)?(www\.)?(xhslink\.com\/[a-zA-Z0-9_\-\/]+|xiaohongshu\.com\/[^\s\)"'\]\>]+)/gi;

    // ========== DOM 元素 ==========
    const input = document.getElementById('input');
    const convertBtn = document.getElementById('convertBtn');
    const pasteBtn = document.getElementById('pasteBtn');
    const resultSection = document.getElementById('resultSection');
    const resultUrl = document.getElementById('resultUrl');
    const errorAlert = document.getElementById('errorAlert');
    const warningAlert = document.getElementById('warningAlert');
    const successAlert = document.getElementById('successAlert');
    const errorText = document.getElementById('errorText');
    const warningText = document.getElementById('warningText');
    const successText = document.getElementById('successText');
    const toast = document.getElementById('toast');

    let currentUrls = [];

    // ========== 核心功能 ==========

    function extractLinks(text) {
      if (!text || !text.trim()) return [];
      const matches = text.match(LINK_REGEX) || [];
      const urls = matches.map(match => {
        const url = match.trim();
        return url.startsWith('http') ? url : 'https://' + url;
      });
      return [...new Set(urls)];
    }

    function isShortLinkUrl(url) {
      try {
        const urlObj = new URL(url);
        return urlObj.hostname === 'xhslink.com' || urlObj.hostname.endsWith('.xhslink.com');
      } catch { return false; }
    }

    function cleanXiaohongshuUrl(url) {
      try {
        const urlObj = new URL(url);
        const essentialParams = ['xsec_token'];
        const params = new URLSearchParams();
        for (const key of essentialParams) {
          if (urlObj.searchParams.has(key)) params.set(key, urlObj.searchParams.get(key));
        }
        let cleanUrl = urlObj.origin + urlObj.pathname;
        const queryString = params.toString();
        if (queryString) cleanUrl += '?' + queryString;
        return cleanUrl;
      } catch { return url; }
    }

    async function resolveShortLink(shortUrl) {
      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), TIMEOUT_MS);
      try {
        const proxyUrl = PROXY_URL + encodeURIComponent(shortUrl);
        const response = await fetch(proxyUrl, { method: 'GET', signal: controller.signal, redirect: 'follow' });
        clearTimeout(timeoutId);
        if (response.ok) {
          // CorsProxy exposes the real destination after redirects in this header.
          const finalUrl = response.headers.get('x-final-url');
          if (isValidXhsContentUrl(finalUrl)) return { success: true, url: finalUrl };

          const text = await response.text();
          const resolved = parseRedirectFromHtml(text);
          if (resolved) return { success: true, url: resolved };
        }
        return { success: false, url: shortUrl, reason: 'shortlink_parse_failed' };
      } catch (error) {
        clearTimeout(timeoutId);
        if (error.name === 'AbortError') return { success: false, url: shortUrl, reason: 'timeout' };
        return { success: false, url: shortUrl, reason: 'network_error' };
      }
    }

    function isValidXhsContentUrl(value) {
      if (!value) return false;
      try {
        const url = new URL(value.replace(/\\u002F/gi, '/').replace(/\\\//g, '/'));
        const host = url.hostname.toLowerCase();
        if (host !== 'xiaohongshu.com' && !host.endsWith('.xiaohongshu.com')) return false;

        const path = url.pathname.toLowerCase();
        // Only accept actual note pages; reject favicon.ico, images, scripts and other assets.
        return /^\\/(explore|discovery\\/item)\\/[a-z0-9]+/.test(path);
      } catch {
        return false;
      }
    }

    function parseRedirectFromHtml(html) {
      const decodedHtml = html
        .replace(/&amp;/g, '&')
        .replace(/\\u002F/gi, '/')
        .replace(/\\\//g, '/');

      const candidates = [];

      // Prefer explicit canonical metadata.
      const metaPatterns = [
        /<meta[^>]+property=["']og:url["'][^>]+content=["']([^"']+)["']/gi,
        /<meta[^>]+content=["']([^"']+)["'][^>]+property=["']og:url["']/gi,
        /<link[^>]+rel=["']canonical["'][^>]+href=["']([^"']+)["']/gi,
        /<link[^>]+href=["']([^"']+)["'][^>]+rel=["']canonical["']/gi,
        /<meta[^>]+http-equiv=["']?refresh["']?[^>]*content=["']?\\d+;\\s*url=([^"'>\\s]+)/gi,
        /window\\.location\\.(?:href|replace)\\s*=\\s*["']([^"']+)["']/gi
      ];

      for (const pattern of metaPatterns) {
        let match;
        while ((match = pattern.exec(decodedHtml)) !== null) candidates.push(match[1]);
      }

      // Fall back to URLs embedded in page state, but only real note paths.
      const embedded = decodedHtml.match(/https?:\\/\\/(?:www\\.)?xiaohongshu\\.com\\/(?:explore|discovery\\/item)\\/[a-zA-Z0-9]+[^\\s"'<>]*/gi) || [];
      candidates.push(...embedded);

      return candidates.find(isValidXhsContentUrl) || null;
    }

    async function convertLink() {
      hideAlerts();
      const text = input.value.trim();
      if (!text) { showError('请输入小红书分享文案或链接'); input.focus(); return; }

      const rawUrls = extractLinks(text);
      if (rawUrls.length === 0) { showError('未能识别到有效的小红书链接，请检查输入内容'); return; }

      setLoading(true);
      currentUrls = [];
      showToast(`发现 ${rawUrls.length} 条链接，正在转换...`);

      try {
        const results = await Promise.all(rawUrls.map(async rawUrl => {
          if (!isShortLinkUrl(rawUrl)) return cleanXiaohongshuUrl(rawUrl);
          const result = await resolveShortLink(rawUrl);
          return result.success ? cleanXiaohongshuUrl(result.url) : rawUrl;
        }));

        currentUrls = [...new Set(results)];
        showResult(currentUrls);

        const failedCount = currentUrls.filter(isShortLinkUrl).length;
        if (failedCount > 0) {
          showWarning(`已转换 ${currentUrls.length} 条链接，其中 ${failedCount} 条短链接因网络限制保留原链接。`);
        } else {
          showSuccess(`转换完成，共 ${currentUrls.length} 条链接`);
        }
      } catch (error) {
        console.error('Convert error:', error);
        showError('转换过程中出现错误，请稍后重试');
      } finally {
        setLoading(false);
      }
    }

    function showResult(urls) {
      resultUrl.replaceChildren();
      urls.forEach((url, index) => {
        const link = document.createElement('a');
        link.href = url;
        link.target = '_self';
        link.rel = 'noopener noreferrer';
        link.textContent = url;
        link.style.display = 'block';
        link.style.color = 'inherit';
        link.style.marginBottom = index < urls.length - 1 ? '10px' : '0';
        resultUrl.appendChild(link);
      });
      document.getElementById('openBtn').href = urls[0];
      resultSection.classList.add('show');
    }

    function hideResult() {
      resultSection.classList.remove('show');
      currentUrls = [];
    }

    function showError(message) { errorText.textContent = message; errorAlert.classList.add('show'); }
    function showWarning(message) { warningText.textContent = message; warningAlert.classList.add('show'); }
    function showSuccess(message) { successText.textContent = message; successAlert.classList.add('show'); }

    function hideAlerts() {
      errorAlert.classList.remove('show');
      warningAlert.classList.remove('show');
      successAlert.classList.remove('show');
    }

    function setLoading(loading) {
      convertBtn.disabled = loading;
      convertBtn.classList.toggle('loading', loading);
      convertBtn.querySelector('.btn-text').textContent = loading ? '转换中...' : '批量转换链接';
    }

    function showToast(message) {
      toast.textContent = message;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2500);
    }

    async function pasteFromClipboard() {
      try {
        const text = await navigator.clipboard.readText();
        input.value = text;
        showToast('已粘贴');
        setTimeout(() => convertLink(), 300);
      } catch {
        showError('无法访问剪贴板，请手动粘贴');
        input.focus();
      }
    }

    async function copyResult() {
      if (currentUrls.length === 0) return;
      const output = currentUrls.join('\n');
      try {
        await navigator.clipboard.writeText(output);
        showToast(`已复制 ${currentUrls.length} 条链接`);
      } catch {
        const textarea = document.createElement('textarea');
        textarea.value = output;
        textarea.style.position = 'fixed';
        textarea.style.opacity = '0';
        document.body.appendChild(textarea);
        textarea.select();
        document.execCommand('copy');
        document.body.removeChild(textarea);
        showToast('链接已复制到剪贴板');
      }
    }

    function clearAll() {
      input.value = '';
      hideResult();
      hideAlerts();
      currentUrls = [];
      input.focus();
    }

    input.addEventListener('keydown', (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') convertLink();
    });

    input.addEventListener('input', () => {
      if (errorAlert.classList.contains('show')) hideAlerts();
    });

    window.addEventListener('DOMContentLoaded', () => input.focus());
  </script>
</body>
</html>
